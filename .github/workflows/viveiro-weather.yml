name: Viveiro • diagnóstico manual

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: viveiro-weather-monitor
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verificar clima e monitor do Viveiro
        shell: bash
        run: |
          set -euo pipefail

          OIDC_RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=fazenda2e-irrigation")"

          OIDC_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          BASE_URL="https://fazenda-2e-irrigacao-production.up.railway.app"

          curl --fail --silent --show-error \
            --retry 2 --retry-delay 3 \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            "$BASE_URL/api/viveiro/weather"
          echo

          curl --fail --silent --show-error \
            --retry 2 --retry-delay 3 \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            "$BASE_URL/api/irrigation/monitor"
          echo
