name: Viveiro • proteção por chuva

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: viveiro-weather-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verificar Weather2-2 e proteger viveiro
        shell: bash
        run: |
          set -euo pipefail

          OIDC_RESPONSE="$(curl --fail --silent --show-error             -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=fazenda2e-irrigation")"

          OIDC_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"

          curl --fail --silent --show-error             --retry 2 --retry-delay 3             -H "Authorization: Bearer ${OIDC_TOKEN}"             "https://app-cafe.vercel.app/api/viveiro/weather"

          echo

          curl --fail --silent --show-error             --retry 2 --retry-delay 3             -H "Authorization: Bearer ${OIDC_TOKEN}"             "https://app-cafe.vercel.app/api/irrigation/monitor"


  kick-viveiro-pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reativar worker do modo rápido quando necessário
        shell: bash
        run: |
          set -euo pipefail

          OIDC_RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=fazenda2e-irrigation")"

          OIDC_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"

          curl --fail --silent --show-error \
            --retry 2 --retry-delay 3 \
            -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://app-cafe.vercel.app/api/viveiro/pulse"
