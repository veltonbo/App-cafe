name: Sync Oracle snapshot

on:
  push:
    branches:
      - fix/consolidate-app-20260913
    paths:
      - .github/workflows/sync-oracle-snapshot.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/consolidate-app-20260913
          fetch-depth: 0

      - name: Download validated Oracle snapshot
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            https://fazenda2e.tail890201.ts.net/repo-sync-fazenda2e-42.tar.gz \
            -o /tmp/fazenda2e-snapshot.tar.gz
          mkdir -p /tmp/fazenda2e-snapshot
          tar -xzf /tmp/fazenda2e-snapshot.tar.gz -C /tmp/fazenda2e-snapshot

      - name: Replace branch tree with validated snapshot
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' /tmp/fazenda2e-snapshot/ ./
          git status --short

      - name: Commit synchronized tree
        run: |
          set -euo pipefail
          git config user.name 'Fazenda 2E Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Tree already synchronized.'
            exit 0
          fi
          git commit -m 'refactor: consolidate irrigation UI and add history 2.0'
          git push origin HEAD:fix/consolidate-app-20260913
